# ==============================
# SGDA Backend - Configuracao Local (PostgreSQL)
# ==============================
spring.application.name=sgda-backend
server.port=8080

# --- Base de Dados (PostgreSQL local) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/sgda_db
spring.datasource.username=postgres
spring.datasource.password=igilse2003
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# Chave secreta usada para assinar os tokens (trocar em producao)
jwt.secret=ChaveSecretaSuperSeguraParaODesenvolvimentoLocalDoProjetoSGDA2026
jwt.expiration-ms=86400000

# --- Spring Mail (ajustar para um servidor SMTP real, ex: Gmail/Mailtrap) ---
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=CHANGE_ME
spring.mail.password=CHANGE_ME
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Se nao houver credenciais configuradas, o envio de email falha silenciosamente (log de aviso)
app.mail.from=no-reply@sgda.local
app.mail.comite-email=comite-etica@sgda.local
app.mail.enabled=false

# --- Utilizador administrador criado automaticamente no primeiro arranque ---
app.admin.nome=Administrador
app.admin.email=admin@sgda.local
app.admin.senha=admin123

# --- CORS (endereco do frontend Angular) ---
app.cors.allowed-origins=http://localhost:4200

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
